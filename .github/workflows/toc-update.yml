# Drop this file into .github/workflows/ in any of your WoW addon repos.
# It runs daily and on manual dispatch. When interface numbers have increased:
#   1. Updates ## Interface: in every .toc file (numbers never decrease)
#   2. Bumps ## Version: by one decimal in the MAIN addon .toc only
#      (the .toc whose filename matches the repo name, e.g. BagSync.toc)
#   3. Commits everything and dispatches release.yml to tag + package.
#
# Version format: X.Y where Y is a plain integer incremented by 1.
#   20.28 → 20.29,  20.99 → 20.100,  12.5 → 12.6  (never rolls over)
#
# Sources (LIVE clients only — PTR/beta/alpha branches are excluded):
#   1. warcraft.wiki.gg Template:LatestPatchInfo  — community-curated
#   2. Gethe/wow-ui-source version.txt (live branches only, no ptr/ptr2)
#   3. BigWigsMods/BigWigs BigWigs.toc            — well-maintained, all flavors
#   4. DeadlyBossMods DBM-Core.toc               — secondary cross-check
#
# Interface number rule: numbers are REPLACED per flavor group each run.
# The script trusts the authoritative live sources and will correct a
# previously-written PTR number back down to the live value.
#
# Flavor groups and their interface number ranges:
#   retail        120000-129999  (Midnight / standard)
#   mop           50000-50999    (Mists of Pandaria Classic)
#   cata          40000-49999    (Cataclysm Classic)
#   wrath_titan   38000-38999    (Classic Titan Reforged)
#   wrath         30000-37999    (Wrath of the Lich King Classic)
#   tbc           20000-29999    (Burning Crusade / Anniversary)
#   classic_era   11000-11999    (Vanilla Classic Era)
#   forever       16000-16999    (Classic Forever — excluded by default)
#   tww           110000-119999  (The War Within — excluded, no longer live)
name: Update TOC Interface Numbers

on:
  schedule:
    - cron: '0 10 * * *'   # daily at 10:00 UTC
  workflow_dispatch:         # manual trigger from Actions tab

jobs:
  update-toc:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to push the commit and tag

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect interface numbers from all sources
        id: collect
        run: |
          python3 - <<'PYEOF'
          import urllib.request, re, os, sys, json

          def fetch(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "wow-toc-updater/1.0"})
                  return urllib.request.urlopen(req, timeout=15).read().decode()
              except Exception as e:
                  print(f"  WARNING: could not fetch {url}: {e}", file=sys.stderr)
                  return ""

          def version_to_iface(version_str):
              """'12.1.0.69875' or '12.1.0' → 120100"""
              parts = version_str.strip().split(".")
              if len(parts) < 3:
                  return None
              try:
                  return int(parts[0]) * 10000 + int(parts[1]) * 100 + int(parts[2])
              except ValueError:
                  return None

          def flavor_group(n):
              """Bucket an interface number by game flavor."""
              if   120000 <= n <= 129999: return "retail"
              if    50000 <= n <= 50999:  return "mop"           # 5.x.x MoP Classic (50000-50999)
              if    40000 <= n <= 49999:  return "cata"
              if    38000 <= n <= 38999:  return "wrath_titan"   # 3.80.x Titan Reforged
              if    30000 <= n <= 37999:  return "wrath"         # 3.x.x standard Wrath
              if    20000 <= n <= 29999:  return "tbc"           # TBC Anniversary / classic_era_ptr
              if    16000 <= n <= 16999:  return "forever"       # Classic Forever Beta
              if    11000 <= n <= 11999:  return "classic_era"   # Vanilla Classic Era
              if   110000 <= n <= 119999: return "tww"           # The War Within (old retail)
              return None  # outside known range → ignore

          # Groups to include in the final TOC line.
          # "tww" (The War Within, 110000-119999) is intentionally excluded —
          # those addons target retail (Midnight) only, not the old TWW client.
          # "forever" is the Classic Forever beta — included here, remove if unwanted.
          INCLUDE_GROUPS = {"retail", "mop", "cata", "wrath_titan", "wrath", "tbc", "classic_era", "forever"}

          # How far ahead the wiki is allowed to be vs the consensus of non-wiki
          # sources before we consider it suspect (a PTR/beta entry).
          # PTR patches are only +5 above live (e.g. 120105 vs 120100), so we
          # must set this to 0 — wiki must exactly match consensus to be trusted.
          # When wiki is ahead at all, we use the consensus (non-wiki) value.
          WIKI_TRUST_DELTA = 0

          # Three-tier tracking:
          #   gethe_best  — Gethe/wow-ui-source LIVE branches only (Blizzard-authoritative)
          #   wiki_best   — warcraft.wiki.gg (live rows only after filtering)
          #   other_best  — BigWigs, DBM (may include PTR builds in their TOC)
          gethe_best = {}  # group → number from Gethe live branch (authoritative)
          wiki_best  = {}  # group → max from wiki live rows
          other_best = {}  # group → max from BigWigs/DBM (cross-check only)

          def record(n, source):
              group = flavor_group(n)
              if group is None:
                  return
              is_gethe = source.startswith("gethe:")
              is_wiki  = source.startswith("wiki:")
              if is_gethe:
                  bucket = gethe_best
              elif is_wiki:
                  bucket = wiki_best
              else:
                  bucket = other_best
              prev = bucket.get(group, 0)
              bucket[group] = max(prev, n)
              marker = " ↑ new max" if n > prev else ""
              print(f"  {n} ({group}){marker}  [{source}]")

          # ------------------------------------------------------------------
          # Source 1: warcraft.wiki.gg — Template:LatestPatchInfo
          # Row format: !!expansion-type!!version!!interface!!build!!date
          # The expansion-type column uses names like "midnight", "vanilla",
          # "classic", "camelot" for LIVE builds, and appends "-test", "-beta",
          # "-alpha", "-ptr", "-xptr" for non-live environments.
          # We skip any row whose expansion type contains those suffixes.
          # ------------------------------------------------------------------
          SKIP_KEYWORDS = {"test", "beta", "alpha", "ptr", "xptr"}

          def is_live_wiki_row(expansion_type, iface_num=None):
              """Return True only if this row represents a LIVE client build.
              Any row whose type name contains a non-live keyword (test, beta,
              alpha, ptr, xptr) as a word segment is skipped. This includes
              'Forever Beta' — forever/camelot will be included once it goes
              live and gets a clean entry without 'beta' in the name."""
              slug = expansion_type.strip().lower()
              segments = slug.replace(" ", "-").split("-")
              for kw in SKIP_KEYWORDS:
                  if kw in segments:
                      return False
              return True

          print("=== warcraft.wiki.gg / Template:LatestPatchInfo ===")
          wiki_url = (
              "https://warcraft.wiki.gg/api.php"
              "?action=query&titles=Template:LatestPatchInfo"
              "&prop=revisions&rvprop=content&rvslots=main&format=json"
          )
          wiki_raw = fetch(wiki_url)
          if wiki_raw:
              try:
                  data = json.loads(wiki_raw)
                  pages = data.get("query", {}).get("pages", {})
                  for page in pages.values():
                      slots = (page.get("revisions") or [{}])[0].get("slots", {})
                      content = slots.get("main", {}).get("*", "")
                      for line in content.split("\n"):
                          if "\\!\\!" not in line:
                              continue
                          parts = line.split("\\!\\!")
                          # parts[0]=icon, parts[1]=expansion-type, parts[2]=version,
                          # parts[3]=interface, parts[4]=build, parts[5]=date
                          if len(parts) < 4:
                              continue
                          expansion_type = parts[1].strip()
                          iface_token = parts[3].strip()
                          if not re.fullmatch(r'\d{5,6}', iface_token):
                              continue
                          iface_num = int(iface_token)
                          if not is_live_wiki_row(expansion_type, iface_num):
                              print(f"  SKIP {iface_token} ({expansion_type}) — non-live build")
                              continue
                          record(iface_num, "wiki:LatestPatchInfo")
              except Exception as e:
                  print(f"  WARNING: {e}", file=sys.stderr)

          # Interface_version page: each live row pairs an expansion label with
          # its interface number. We look for lines that contain "Live" or have
          # no test/beta/ptr/alpha marker. Since the page format may change,
          # we skip lines whose text contains any non-live keyword.
          print("\n=== warcraft.wiki.gg / Interface_version ===")
          wiki_url2 = (
              "https://warcraft.wiki.gg/api.php"
              "?action=query&titles=Interface_version"
              "&prop=revisions&rvprop=content&rvslots=main&format=json"
          )
          wiki_raw2 = fetch(wiki_url2)
          if wiki_raw2:
              try:
                  data2 = json.loads(wiki_raw2)
                  pages2 = data2.get("query", {}).get("pages", {})
                  for page in pages2.values():
                      slots2 = (page.get("revisions") or [{}])[0].get("slots", {})
                      content2 = slots2.get("main", {}).get("*", "")
                      for line in content2.split("\n"):
                          line_lower = line.lower()
                          # Skip any line that mentions non-live environments
                          if any(kw in line_lower for kw in SKIP_KEYWORDS):
                              continue
                          for token in re.findall(r'\b(\d{5,6})\b', line):
                              record(int(token), "wiki:Interface_version")
              except Exception as e:
                  print(f"  WARNING: {e}", file=sys.stderr)

          # ------------------------------------------------------------------
          # Source 2: Gethe/wow-ui-source — version.txt per branch
          # Blizzard's own UI source mirror. No Cata Classic branch exists here.
          # ------------------------------------------------------------------
          print("\n=== Gethe/wow-ui-source (version.txt per branch) ===")
          # LIVE branches only — ptr and ptr2 are excluded to avoid beta/PTR
          # interface numbers (e.g. 120105) being mistaken for live retail.
          # classic_ptr and classic_era_ptr are also excluded for the same reason.
          gethe_branches = [
              "live",           # retail live
              "classic",        # MoP Classic live
              "classic_era",    # Classic Era live
              "classic_anniversary",  # TBC Anniversary live
              "classic_titan",  # Wrath Titan Reforged live
          ]
          for branch in gethe_branches:
              url = f"https://raw.githubusercontent.com/Gethe/wow-ui-source/{branch}/version.txt"
              text = fetch(url)
              if not text:
                  continue
              iface = version_to_iface(text.strip())
              if iface is not None:
                  record(iface, f"gethe:{branch}")
              else:
                  print(f"  {branch}: could not parse '{text.strip()}'")

          # ------------------------------------------------------------------
          # Source 3: BigWigsMods/BigWigs — single TOC covers all flavors
          # ------------------------------------------------------------------
          print("\n=== BigWigsMods/BigWigs ===")
          bw_text = fetch("https://raw.githubusercontent.com/BigWigsMods/BigWigs/master/BigWigs.toc")
          for line in bw_text.splitlines():
              if line.startswith("## Interface:"):
                  for token in line.split(":", 1)[1].split(","):
                      token = token.strip()
                      if token.isdigit():
                          record(int(token), "BigWigs")
                  break

          # ------------------------------------------------------------------
          # Source 4: DeadlyBossMods — secondary cross-check
          # ------------------------------------------------------------------
          print("\n=== DeadlyBossMods ===")
          dbm_text = fetch("https://raw.githubusercontent.com/DeadlyBossMods/DBM-Retail/master/DBM-Core/DBM-Core.toc")
          for line in dbm_text.splitlines():
              if line.startswith("## Interface:"):
                  for token in line.split(":", 1)[1].split(","):
                      token = token.strip()
                      if token.isdigit():
                          record(int(token), "DBM")
                  break

          # ------------------------------------------------------------------
          # Assemble final list.
          # Priority: Gethe live (Blizzard-authoritative) > wiki live rows > other
          #
          # Gethe live branches are Blizzard's own UI source mirror — they only
          # ever reflect the actual live client, never PTR or beta. When Gethe
          # has a number for a group it wins outright. BigWigs/DBM include PTR
          # builds in their TOC so they are used only as a fallback when neither
          # Gethe nor wiki have data for a group.
          # ------------------------------------------------------------------
          print("\n=== Final arbitration ===")
          final_nums = []
          all_groups = INCLUDE_GROUPS & (set(gethe_best) | set(wiki_best) | set(other_best))
          for group in all_groups:
              gethe_num = gethe_best.get(group, 0)
              wiki_num  = wiki_best.get(group, 0)
              other_num = other_best.get(group, 0)

              if gethe_num:
                  winner = gethe_num
                  reason = f"Gethe live authoritative ({gethe_num})"
              elif wiki_num and other_num:
                  if other_num <= wiki_num <= other_num + WIKI_TRUST_DELTA:
                      winner = wiki_num
                      reason = f"wiki {wiki_num} matches consensus {other_num} — trusting wiki"
                  elif wiki_num < other_num:
                      winner = other_num
                      reason = f"wiki {wiki_num} behind consensus {other_num} — using consensus"
                  else:
                      winner = other_num
                      reason = f"wiki {wiki_num} ahead of consensus {other_num} — using consensus"
              elif wiki_num:
                  winner = wiki_num
                  reason = f"wiki only ({wiki_num}), no other sources"
              else:
                  winner = other_num
                  reason = f"other sources only ({other_num}), no Gethe/wiki data"

              print(f"  {group}: {winner}  ({reason})")
              final_nums.append(winner)

          final_nums.sort(reverse=True)

          if not final_nums:
              print("\nERROR: no interface numbers collected from any source!", file=sys.stderr)
              sys.exit(1)

          iface_line = "## Interface: " + ", ".join(str(n) for n in final_nums)
          print(f"\n=== Result ===")
          print(iface_line)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"iface_line={iface_line}\n")
              f.write(f"nums={','.join(str(n) for n in final_nums)}\n")
          PYEOF

      - name: Update TOC files and bump version
        id: update
        env:
          IFACE_LINE: ${{ steps.collect.outputs.iface_line }}
          NUMS: ${{ steps.collect.outputs.nums }}
          # manual=true forces a version bump + release dispatch even if interface
          # numbers didn't change — used to re-sync addons that got out of whack.
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          python3 - <<'PYEOF'
          import re, glob, os, sys

          new_line = os.environ["IFACE_LINE"]
          new_nums = set(int(x) for x in os.environ["NUMS"].split(",") if x)
          force_release = os.environ.get("FORCE_RELEASE", "false").strip().lower() == "true"

          if not new_nums:
              print("ERROR: no interface numbers — aborting", file=sys.stderr)
              sys.exit(1)

          if force_release:
              print("*** Manual run — version bump and release will fire even if TOC unchanged ***")

          def flavor_group(n):
              if   120000 <= n <= 129999: return "retail"
              if    50000 <= n <= 50999:  return "mop"
              if    40000 <= n <= 49999:  return "cata"
              if    38000 <= n <= 38999:  return "wrath_titan"
              if    30000 <= n <= 37999:  return "wrath"
              if    20000 <= n <= 29999:  return "tbc"
              if    16000 <= n <= 16999:  return "forever"
              if    11000 <= n <= 11999:  return "classic_era"
              if   110000 <= n <= 119999: return "tww"
              return "other"

          def safe_merge(existing_line, new_line):
              """
              Replace interface numbers per flavor group with the authoritative
              live values from new_line. Numbers for groups NOT present in new_line
              are preserved from existing_line (unknown/unsupported groups).
              This means a PTR number (e.g. 120105) gets corrected back to the
              live value (e.g. 120100) when the live sources agree on the lower one.
              """
              def parse(line):
                  result = {}
                  for token in line.split(":", 1)[-1].split(","):
                      token = token.strip()
                      if token.isdigit():
                          n = int(token)
                          g = flavor_group(n)
                          result[g] = max(result.get(g, 0), n)
                  return result

              old_by_group = parse(existing_line)
              new_by_group = parse(new_line)

              merged = {}
              # Start with existing groups
              for g, n in old_by_group.items():
                  merged[g] = n
              # Overwrite with authoritative live values (may go down for PTR fixes)
              for g, n in new_by_group.items():
                  merged[g] = n

              merged_nums = sorted(merged.values(), reverse=True)
              merged_line = "## Interface: " + ", ".join(str(n) for n in merged_nums)
              return merged_line, (merged_line != existing_line)

          def bump_version(version_str):
              """
              Increment the decimal part by 1.
              '20.28' → '20.29',  '20.99' → '20.100',  '12.5' → '12.6'
              Returns new version string, or None if unparseable.
              """
              version_str = version_str.strip()
              m = re.fullmatch(r'(\d+)\.(\d+)', version_str)
              if not m:
                  return None
              major = int(m.group(1))
              minor = int(m.group(2))
              return f"{major}.{minor + 1}"

          # Determine the main addon TOC: the .toc whose stem matches the repo name.
          # GITHUB_REPOSITORY is "owner/reponame" — we want just "reponame".
          repo_name = os.environ.get("GITHUB_REPOSITORY", "").split("/")[-1]
          main_toc_name = f"{repo_name}.toc" if repo_name else None
          print(f"Repo: {repo_name}  →  main TOC: {main_toc_name}")

          any_changed = False
          new_version = None
          main_toc_text = None
          main_toc_path = None

          for toc_path in glob.glob("**/*.toc", recursive=True):
              toc_filename = os.path.basename(toc_path)
              is_main = (main_toc_name and toc_filename.lower() == main_toc_name.lower())

              text = open(toc_path, encoding="utf-8").read()

              # --- Update ## Interface: (all TOC files) ---
              iface_match = re.search(r"^## Interface:.*", text, flags=re.MULTILINE)
              if not iface_match:
                  print(f"Skipping {toc_path}: no ## Interface: line")
                  continue

              existing_iface = iface_match.group(0)
              merged_iface, iface_changed = safe_merge(existing_iface, new_line)

              if iface_changed:
                  text = text[:iface_match.start()] + merged_iface + text[iface_match.end():]
                  print(f"Interface updated in {toc_path}:")
                  print(f"  was: {existing_iface}")
                  print(f"  now: {merged_iface}")
                  any_changed = True
              else:
                  print(f"Interface no change: {toc_path}")

              # --- Bump ## Version: (main TOC only) ---
              # Cron: only if interface changed.
              # Manual: always, even if interface was already current.
              should_bump = is_main and (iface_changed or force_release)
              if should_bump:
                  ver_match = re.search(r"^## Version:\s*(.+)", text, flags=re.MULTILINE)
                  if ver_match:
                      old_ver = ver_match.group(1).strip()
                      bumped = bump_version(old_ver)
                      if bumped:
                          new_version = bumped
                          new_ver_line = f"## Version: {bumped}"
                          text = text[:ver_match.start()] + new_ver_line + text[ver_match.end():]
                          print(f"Version bumped in {toc_path}: {old_ver} → {bumped}")
                          any_changed = True  # ensure commit step runs
                      else:
                          print(f"  WARNING: could not parse version '{old_ver}' — skipping version bump")
                  else:
                      print(f"  WARNING: no ## Version: line found in {toc_path} — skipping version bump")

              # Write updated file if anything changed for this TOC
              if iface_changed or (is_main and new_version):
                  open(toc_path, "w", encoding="utf-8").write(text)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if any_changed else 'false'}\n")
              f.write(f"new_version={new_version if new_version else ''}\n")
          PYEOF

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        env:
          NEW_VERSION: ${{ steps.update.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*.toc"
          if [ -n "$NEW_VERSION" ]; then
            git commit -m "chore: update TOC interface numbers → v${NEW_VERSION}"
          else
            git commit -m "chore: update TOC interface numbers"
          fi
          git push

      - name: Dispatch release workflow
        if: steps.update.outputs.changed == 'true' && steps.update.outputs.new_version != ''
        env:
          NEW_VERSION: ${{ steps.update.outputs.new_version }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          # Dispatch release.yml — it will create the git tag itself before
          # running the packager, so the packager sees the correct version.
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --field version="v${NEW_VERSION}"
          echo "Dispatched release.yml for v${NEW_VERSION}."
